services:
  redis:
    image: redis:alpine
    container_name: air-hockey-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: air-hockey-api
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
      - "8050:8050/udp"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - UDPPORT=8050
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
